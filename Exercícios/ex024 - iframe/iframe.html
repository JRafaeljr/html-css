<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iFrame</title>
</head>
<body>
    <h1>Estudo de iframe</h1>
    <!--Tamanho padrão do iframe é de 300x150-->
    <!--Dá para configurar o tamanho na própria tag iframe, como também no CSS. A configuração no CSS tem prioridade sobre a configuração na tag.-->
    <!--Dá para usar o scrolling="no" para retirar a barra de rolagem, não possibilitando que se role a página no frame. Ainda dá para usar os parâmetros yes e auto.-->
    <p>Faço ótimos cursos do <iframe src="https://www.cursoemvideo.com/" frameborder="0" width="500px" height="350px"></iframe></p>

    <p>E fiz um Curso Técnico na UFSM através do <iframe src="https://ead06.proj.ufsm.br/login/index.php" frameborder="0"></iframe></p>
</body>
</html>
